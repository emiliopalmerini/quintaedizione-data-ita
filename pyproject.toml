[project]
name = "quintaedizione-data-ita"
version = "1.0.0"
description = "Italian SRD 5.2.1 PDF data compiler"
requires-python = ">=3.12"
dependencies = [
    "pymupdf==1.27.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["scripts/parse_srd_v2/tests"]
addopts = "-q"
markers = [
    "full_pdf: release acceptance tests requiring SRD_521_IT_PDF",
]
